<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade // SNELL LABS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <a href="/" class="logo">SNELL LABS</a>
    <nav>
      <a href="/">Projects</a>
      <a href="/games/" class="active">Arcade</a>
    </nav>
  </header>

  <main>
    <h1 style="font-size: 1.8rem; margin-bottom: 1rem;">Reaction Test</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Click the target as quickly as possible when it turns blue.</p>

    <!-- Game Container -->
    <div id="game-box" style="width: 100%; height: 300px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none;">
      <span id="game-text" style="font-family: var(--font-mono); font-size: 1.2rem;">Click "Start" to Begin</span>
    </div>
  </main>

  <script>
    const box = document.getElementById('game-box');
    const text = document.getElementById('game-text');
    let startTime, timer;
    let state = 'idle'; // idle, waiting, ready

    box.addEventListener('click', () => {
      if (state === 'idle') {
        state = 'waiting';
        text.textContent = 'Wait for blue...';
        box.style.background = 'var(--card-bg)';
        const delay = Math.floor(Math.random() * 3000) + 2000;
        timer = setTimeout(() => {
          state = 'ready';
          box.style.background = 'var(--accent-color)';
          text.textContent = 'CLICK NOW!';
          startTime = Date.now();
        }, delay);
      } else if (state === 'waiting') {
        clearTimeout(timer);
        state = 'idle';
        text.textContent = 'Too early! Click to try again.';
      } else if (state === 'ready') {
        const reactionTime = Date.now() - startTime;
        state = 'idle';
        box.style.background = 'var(--card-bg)';
        text.textContent = `Reaction time: ${reactionTime} ms! Click to restart.`;
      }
    });
  </script>
</body>
</html>
