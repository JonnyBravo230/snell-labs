<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders // SNELL LABS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <a href="/" class="brand">SNELL LABS <span class="brand-badge">SECURE R&D</span></a>
    <nav>
      <a href="/">Overview</a>
      <a href="/inventory/">Inventory</a>
      <a href="/order/">Requisition</a>
      <a href="/orders/" class="active">Ledger</a>
    </nav>
  </header>

  <main>
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Active Operative Requisitions</h1>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Real-time fulfillment ledger for custom defense contracts.</p>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="control-group">
        <label for="search-input">Search:</label>
        <input type="text" id="search-input" placeholder="Search operative, item..." oninput="filterAndSortTable()">
      </div>

      <div class="control-filters">
        <div class="control-group">
          <label for="filter-affiliation">Affiliation:</label>
          <select id="filter-affiliation" onchange="filterAndSortTable()"></select>
        </div>

        <div class="control-group">
          <label for="filter-status">Status:</label>
          <select id="filter-status" onchange="filterAndSortTable()"></select>
        </div>

        <div class="control-group">
          <label for="sort-by">Sort By:</label>
          <select id="sort-by" onchange="filterAndSortTable()">
            <option value="id-asc">Order ID</option>
            <option value="name-asc">Operative Name</option>
            <option value="cost-desc">Cost (High to Low)</option>
            <option value="cost-asc">Cost (Low to High)</option>
            <option value="qty-desc">Quantity</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Structured Data Table Container -->
    <div class="table-container">
      <table id="orders-table">
        <colgroup>
          <col class="col-id">
          <col class="col-name">
          <col class="col-affiliation">
          <col class="col-gadget">
          <col class="col-qty">
          <col class="col-cost">
          <col class="col-status">
        </colgroup>
        <thead>
          <tr>
            <th class="text-left">Order ID</th>
            <th class="text-left">Operative</th>
            <th class="text-left">Affiliation</th>
            <th class="text-left">Hardware Item</th>
            <th class="text-center">Qty</th>
            <th class="text-right">Total Cost</th>
            <th class="text-center">Fulfillment</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Dynamically populated rows -->
        </tbody>
      </table>
    </div>

  <p class="ledger-note" id="ledger-note" hidden>
    Requisitions you submit are saved in this browser only.
    <button type="button" id="clear-submitted">Clear my requisitions</button>
  </p>
  </main>

  <script src="/js/data.js"></script>
  <script>
    document.getElementById('filter-affiliation').innerHTML =
      '<option value="ALL">All Affiliations</option>' +
      SL_AFFILIATIONS.map(a => `<option value="${a}">${a}</option>`).join('');
    document.getElementById('filter-status').innerHTML =
      '<option value="ALL">All Statuses</option>' +
      Object.keys(SL_STATUSES).map(s => `<option value="${s}">${s}</option>`).join('');

    function filterAndSortTable() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const affiliation = document.getElementById('filter-affiliation').value;
      const status = document.getElementById('filter-status').value;
      const sortBy = document.getElementById('sort-by').value;

      const filtered = slAllOrders().filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(search) ||
                              item.product.toLowerCase().includes(search) ||
                              ('#sl-' + item.id).includes(search);
        const matchesAffiliation = affiliation === 'ALL' || item.affiliation === affiliation;
        const matchesStatus = status === 'ALL' || item.status === status;
        return matchesSearch && matchesAffiliation && matchesStatus;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'id-asc') return a.id - b.id;
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        if (sortBy === 'cost-desc') return b.cost - a.cost;
        if (sortBy === 'cost-asc') return a.cost - b.cost;
        if (sortBy === 'qty-desc') return b.qty - a.qty;
        return 0;
      });

      const tbody = document.getElementById('table-body');
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="color: var(--text-muted); padding: 2rem;">No matching requisitions found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td class="text-left" style="font-family:var(--font-mono); font-weight:600; color:#60a5fa;">#SL-${item.id}</td>
          <td class="text-left"><strong>${slEscape(item.name)}</strong></td>
          <td class="text-left" style="color:var(--text-muted);">${slEscape(item.affiliation)}</td>
          <td class="text-left">${slEscape(item.product)}</td>
          <td class="text-center" style="font-family:var(--font-mono);">${item.qty}</td>
          <td class="text-right" style="font-family:var(--font-mono); font-weight:600;">${slFormatCurrency(item.cost)}</td>
          <td class="text-center"><span class="badge ${SL_STATUSES[item.status] || ''}">${item.status}</span></td>
        </tr>`).join('');
    }

    const note = document.getElementById('ledger-note');
    note.hidden = slLoadSubmitted().length === 0;
    document.getElementById('clear-submitted').addEventListener('click', () => {
      slSaveSubmitted([]);
      note.hidden = true;
      filterAndSortTable();
    });

    filterAndSortTable();
  </script>

</body>
</html>
