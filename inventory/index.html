<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory // SNELL LABS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header>
    <a href="/" class="brand">SNELL LABS <span class="brand-badge">SECURE R&D</span></a>
    <nav>
      <a href="/">Overview</a>
      <a href="/inventory/" class="active">Inventory</a>
      <a href="/order/">Requisition</a>
      <a href="/orders/">Ledger</a>
    </nav>
  </header>

  <main>
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Tactical Inventory Catalog</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Authorized hardware available for operational deployment.</p>

    <div class="card-grid" id="inventory-grid"></div>
  </main>

  <script src="/js/data.js"></script>
  <script>
    document.getElementById('inventory-grid').innerHTML = SL_PRODUCTS.map(p => `
      <div class="card">
        <div>
          <div class="card-head">
            <h3>${slEscape(p.name)}</h3>
            <span class="badge ${p.stock === 'Limited' ? 'badge-pending' : 'badge-fulfilled'}">${p.stock}</span>
          </div>
          <p class="card-desc">${slEscape(p.description)}</p>
        </div>
        <div class="card-foot">
          <span class="card-clearance">CLEARANCE L-${p.clearance}</span>
          <span class="card-price">${slFormatCurrency(p.price)}</span>
        </div>
        <a class="card-cta" href="/order/?item=${p.id}">Requisition &rarr;</a>
      </div>`).join('');
  </script>

</body>
</html>
